[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admaker"
version = "1.0.0"
description = "Generate AI short-form product ads for TikTok, Reels and YouTube Shorts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
admaker = "admaker.cli:main"

[tool.setuptools]
packages = ["admaker", "admaker.providers"]

[tool.setuptools.package-data]
admaker = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises the full render pipeline (takes ~30s)"]
